<body><header class="wof-header"><a class="back" href="./" aria-label="返回游戏大厅">← 大厅</a><div class="game-name"><strong>街机三国志</strong><span>WARRIORS OF FATE · CPS1 原版</span></div><button id="sound" aria-pressed="false">声音关</button><button id="fullscreen" aria-label="切换全屏">全屏</button></header>
